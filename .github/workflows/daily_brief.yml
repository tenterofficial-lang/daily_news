name: Tenter AI Daily News Dispatcher

on:
  schedule:
    # Runs every day at 07:00 AM UTC
    - cron: '0 7 * * *'
  workflow_dispatch: # Allows manual trigger anytime from GitHub UI

jobs:
  run-news-engine:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser pandas google-generativeai resend

      - name: Execute Main Script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python main.py

      - name: Commit and Push Updated CSV Archive
        run: |
          git config --global user.name "Tenter AI Bot"
          git config --global user.email "bot@tenter.ai"
          git add news_archive.csv briefs/
          git commit -m "Auto-update news archive for $(date +'%Y-%m-%d')" || exit 0
          git push
