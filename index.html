<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tenter AI — Executive Daily Briefing</title>
  
  <!-- Favicon (Uses your repo's logo image) -->
  <link rel="icon" type="image/png" href="tenter.ai.png">

  <style>
    :root {
      --bg: #09090b;
      --card-bg: #121215;
      --border: #27272a;
      --text: #f4f4f5;
      --text-muted: #a1a1aa;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --success: #4ade80;
      --error: #f87171;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }

    .container {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      width: 100%;
      max-width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 0 0 80px rgba(37, 99, 235, 0.08);
    }

    .logo {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      margin-bottom: 1.25rem;
      object-fit: cover;
    }

    .badge {
      display: inline-block;
      background: rgba(37, 99, 235, 0.15);
      color: #60a5fa;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 9999px;
      margin-bottom: 1rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 0.5rem;
    }

    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    input[type="email"] {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #09090b;
      color: var(--text);
      font-size: 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="email"]:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.25);
    }

    button {
      width: 100%;
      padding: 14px 16px;
      border-radius: 10px;
      border: none;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    button:hover { background: var(--accent-hover); }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.6; cursor: not-allowed; }

    .footer-note {
      font-size: 0.8rem;
      color: #71717a;
      margin-top: 1rem;
      margin-bottom: 0;
    }

    #msg {
      margin-top: 1rem;
      font-size: 0.875rem;
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Displays the image file directly from your GitHub repository -->
    <img src="tenter.ai.png" alt="Tenter AI Logo" class="logo" onerror="this.style.display='none'">
    
    <div>
      <span class="badge">Daily Newsletter</span>
    </div>

    <h1>Tenter AI Brief</h1>
    <p>Join smart founders and executives receiving automated daily summaries on AI advancements.</p>

    <form id="subscribe-form">
      <input type="hidden" name="access_key" value="YOUR_ACTUAL_WEB3FORMS_ACCESS_KEY">
      <input type="hidden" name="subject" value="New Subscriber for Tenter AI!">
      <input type="hidden" name="from_name" value="Tenter AI Landing Page">

      <input type="email" name="email" id="email-input" placeholder="Enter your work email" required />
      <button type="submit" id="btn">Subscribe for Free</button>
    </form>

    <p class="footer-note">No spam. Unsubscribe anytime.</p>
    <p id="msg"></p>
  </div>

  <script>
    const form = document.getElementById('subscribe-form');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      btn.innerText = "Subscribing...";
      btn.disabled = true;
      msg.innerText = "";

      const formData = new FormData(form);
      const object = Object.fromEntries(formData);
      const json = JSON.stringify(object);

      try {
        const res = await fetch('https://api.web3forms.com/submit', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json'
          },
          body: json
        });

        const data = await res.json();

        if (res.status === 200) {
          msg.style.color = "var(--success)";
          msg.innerText = "You're in! Welcome to Tenter AI.";
          form.reset();
        } else {
          msg.style.color = "var(--error)";
          msg.innerText = data.message || "Error subscribing. Try again.";
        }
      } catch (err) {
        msg.style.color = "var(--error)";
        msg.innerText = "Connection error. Please try again later.";
      } finally {
        btn.innerText = "Subscribe for Free";
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
